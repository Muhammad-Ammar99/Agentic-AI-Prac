[project]
name = "langchainupdated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Ammar", email = "ammarahmer59@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cerebras-cloud-sdk>=1.91.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.1",
    "langchain-cerebras>=0.8.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchainupdated = "langchainupdated:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
